# Arquivo: mkdocs.yml
#
# Configuração base para o site de documentação e divulgação do Método MZ-M.
# LOCAL: Raiz do Repositório

# --- Configurações Básicas do Site ---

# O nome do seu projeto. Aparecerá no título do site.
site_name: "Método MZ-M: Modelagem Zen de Sistemas"

# A URL base onde o site será hospedado (Ajuste conforme sua URL real do GitHub Pages)
# Exemplo: https://seunome.github.io/nome-do-repo/
site_url: "https://MzMagaiver.github.io/mzm-method/"

# URL do repositório GitHub. Usado para links como "Edit on GitHub" ou ícones.
repo_url: "https://github.com/MzMagaiver/mzm-method/"

# Nome do repositório (opcional, mas útil para o tema)
repo_name: "MzMagaiver/mzm-method"

# Copyright (opcional)
copyright: "Copyright © 2023 - 2025 MzMagaiver"

# --- Configurações do Tema ---

# Usaremos o tema Material para MkDocs, que é popular e visualmente atraente.
theme:
  name: "material"

  # Cores do tema (opcional, personalize!)
  palette:
    primary: "Deep Purple" # Cor principal
    accent: "Light Blue"   # Cor de destaque

  # Logo (opcional) - Adicione o caminho para o seu arquivo de logo aqui
  # logo: assets/images/nome-do-seu-logo.png # Exemplo: docs/assets/images/logo-mzm.png

  # Recursos (opcional, habilita funcionalidades do tema)
  features:
    - navigation.tabs # Navegação principal como abas no topo
    - navigation.instant # Carregamento instantâneo de páginas
    # - toc.integrate # Integrar ToC na navegação lateral

# --- Configurações de Navegação (O Coração do Site) ---

# Define a estrutura de navegação do site, mapeando nomes para arquivos Markdown.
# Os caminhos dos arquivos (.md, .mzm) são relativos à pasta 'docs/'.
nav:
  - Home: "index.md"

  # Manual do Arquiteto Zen - Organizado em seções
  - "Manual do Arquiteto Zen":
    - "Introdução": "manual/introducao.md"
    - "A Gramática MZ-M": "manual/gramatica.md"
    - "Ferramentas Essenciais": "manual/ferramentas.md"
    - "Runtime e Rastreabilidade": "manual/runtime.md"
    - "A Visão Completa": "manual/visao-completa.md"

  # Exemplos de Modelos MZ-M
  - "Exemplos": # Este é o item principal na navegação
    # O link para a introdução dos exemplos (o arquivo que já existe)
    - "Introdução aos Exemplos": "examples/index.md"
    # Links para as novas páginas .md que exibem o código .mzm
    - "Exemplo 1: Invariantes": "examples/usuario_invariants.md"
    - "Exemplo 2: Intenção/Contrato": "examples/usuario_login.md"
    - "Exemplo 3: Causalidade": "examples/usuario_causalidade.md"

  # Playground Online (Link Externo ou Interno futuro)
  - "Playground Online": "https://<link-para-seu-playground-quando-pronto>" # Lembre-se de ajustar este link!

  # Repositório GitHub (Link direto)
  - "Repositório GitHub": "https://github.com/MzMagaiver/mzm-method/"

# --- Configurações de Plugins (Opcional, Mas Útil) ---

# Habilita plugins para funcionalidades extras.
plugins:
  # O plugin 'scm' foi removido temporariamente do mkdocs.yml por causa de um erro de build anterior.
  # - scm: {} # <<< ESTA LINHA FOI REMOVIDA TEMPORARIAMENTE

  # Plugin para incluir conteúdo de outros arquivos Markdown
  - include-markdown

  # Plugin para copiar arquivos estáticos de fora da pasta docs/
  - static-files: # <<< NOVO PLUGIN AQUI
      # Lista de arquivos/pastas a serem copiados, caminhos relativos à raiz do repositório
      - 'grammar/' # Copia a pasta 'grammar' inteira para 'site/grammar/'
      # Se houver outros arquivos/pastas fora de docs/ que você quer linkar diretamente, adicione-os aqui.
      # Exemplo: - 'caminho/para/seu/arquivo.ext'

# --- Extensões de Markdown (Opcional) ---

# Habilita extensões para funcionalidades extras no Markdown (tabelas, notas de rodapé, etc.)
markdown_extensions:
  - admonition # Blocos de "Nota", "Aviso", etc.
  - pymdownx.highlight: # Sintaxe highlighting
      linenums: true # Numeração de linhas nos blocos de código
  - pymdownx.superfences # Blocos de código aninhados
  - pymdownx.details # Blocos de detalhes retráteis
  - pymdownx.snippets: # Incluir snippets de código de arquivos externos
      base_path: # Lista de caminhos base para procurar snippets (usado pelo {{ include }})
        - "."
        - "../grammar"
        - "../tools"
        - "../common_rules_repo/rules"
        - "../examples"

# --- Configurações de Deploy (Usado pelo GitHub Actions) ---
# remote_branch: gh-pages # Não necessário com actions/deploy-pages
# site_dir: site # Não necessário com actions/upload-pages-artifact

# Nota: As configurações de deploy específicas são gerenciadas pelo workflow de GitHub Actions
# e pela configuração de Pages no repositório (Source: GitHub Actions, Build: Static HTML).
