# Arquivo: .github/workflows/deploy-docs.yml
#
# Workflow de GitHub Actions para construir e deployar o site MkDocs para GitHub Pages.
# Aciona automaticamente em pushes para o branch principal.
# LOCAL: .github/workflows/

name: Deploy Docs via MkDocs

on:
  push:
    branches:
      - main # Ou o nome do seu branch principal, Ex: master, main

# Permissões necessárias para a ação de deploy no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Construir e Deployar Site

    # Executa o job em um agente Ubuntu recente fornecido pelo GitHub
    runs-on: ubuntu-latest

    steps:
      # Passo 1: Fazer checkout do código do repositório
      - name: Fazer Checkout do Código
        uses: actions/checkout@v4
        # Com fetch-depth: 0, o histórico completo do Git é baixado,
        # o que é necessário para plugins do MkDocs que usam metadados do Git.
        with:
          fetch-depth: 0

      # Passo 2: Configurar o ambiente Python
      # Necessário para instalar e rodar o MkDocs.
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x # Use a versão mais recente do Python 3

      # Passo 3: Instalar as dependências do MkDocs
      # Instala o MkDocs, o tema e todos os plugins em um único comando para melhor resolução de dependências.
      - name: Instalar MkDocs e Tema e Plugins
        run: pip install mkdocs mkdocs-material==9.5.20 mkdocs-include-markdown-plugin
          # O plugin mkdocs.plugins.scm (referenciado como 'scm' no mkdocs.yml)
          # é geralmente incluído com o MkDocs e não precisa ser instalado separadamente.
          # Se você adicionar outros plugins no futuro, adicione-os na linha acima.

      # Passo 4: Construir o Site MkDocs
      # Roda o comando mkdocs build, que lê o mkdocs.yml e os arquivos em /docs.
      # O site gerado vai para a pasta padrão 'site/'.
      - name: Construir Site
        run: mkdocs build

      # REMOVIDO: O passo 'Configurar GitHub Pages' foi removido para evitar conflitos
      # com a configuração manual no repositório e simplificar o deploy.

      # Passo 5: Fazer Deploy para GitHub Pages
      # Usa a ação dedicada para publicar o conteúdo da pasta 'site/'
      # O GitHub Pages, configurado no repositório, usará o artefato deste upload.
      - name: Fazer Deploy para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Uploads the site folder
          path: './site'
          # O nome do artefato é 'github-pages' por padrão na v3 e é o esperado pelo Pages
          name: github-pages # Mantido explicitamente para clareza
          retention-days: 1 # Define por quanto tempo o artefato será mantido (opcional)


      # O passo final de deploy para GH Pages é feito automaticamente PELO GitHub Pages
      # após o upload do artefato 'github-pages', APENAS se a configuração no repositório
      # estiver definida para usar GitHub Actions como fonte.
