# Arquivo: .github/workflows/deploy-docs.yml
#
# Workflow de GitHub Actions para construir e deployar o site MkDocs para GitHub Pages.
# Aciona automaticamente em pushes para o branch principal.
# Este workflow gera HTML estático usando MkDocs e o deploya via GitHub Pages Actions.
# LOCAL: .github/workflows/

name: Deploy Docs via MkDocs

on:
  push:
    branches:
      - main # Ou o nome do seu branch principal, Ex: master, main

  # Permite rodar este workflow manualmente na aba Actions
  workflow_dispatch:

# Define as permissões do GITHUB_TOKEN para permitir o deploy no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write # Necessário para autenticação com o serviço Pages

# Permite apenas um deploy concorrente por vez, útil para evitar conflitos.
concurrency:
  group: "pages"
  cancel-in-progress: false # Não cancela runs em progresso, permite que o deploy atual termine.

jobs:
  # Job principal de construção e deploy
  deploy:
    name: Construir e Deployar Site

    # Define o ambiente de deploy (configurado nas Settings > Pages)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} # Pega a URL publicada do passo de deploy

    # Executa o job em um agente Ubuntu recente fornecido pelo GitHub
    runs-on: ubuntu-latest

    steps:
      # Passo 1: Fazer checkout do código do repositório
      # Obtém o código mais recente do repositório. fetch-depth: 0 é para histórico completo, útil para alguns plugins MkDocs.
      - name: Fazer Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Passo 2: Configurar o ambiente Python
      # Configura o Python no runner, necessário para instalar e rodar o MkDocs.
      # Usando Python 3.12 para compatibilidade com plugins.
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12 # Mantido em 3.12

      # Passo 3: Instalar as dependências do MkDocs e Plugins
      # Tenta instalar o plugin mkdocs-static-files separadamente primeiro para contornar problemas de instalação.
      # Usando flags para evitar cache e forçar reinstalação.
      # Em seguida, instala as demais dependências de requirements.txt.
      - name: Instalar MkDocs e Tema e Plugins
        run: |
          echo "Attempting to install mkdocs-static-files separately..."
          pip install mkdocs-static-files --no-cache-dir --upgrade --force-reinstall || { echo "Failed to install mkdocs-static-files separately, proceeding with requirements.txt"; }
          echo "Installing dependencies from requirements.txt..."
          pip install -r requirements.txt
          # O plugin mkdocs.plugins.scm (referenciado como 'scm' no mkdocs.yml)
          # é geralmente incluído com o MkDocs, mas causou um erro anterior.
          # Se você resolver o problema com o plugin 'scm' no futuro, pode precisar instalá-lo explicitamente aqui
          # ou verificar se ele é incluído automaticamente com a versão do MkDocs.

      # Passo 4: Construir o Site MkDocs
      # Executa o comando que lê o mkdocs.yml e os arquivos em /docs, gerando o site estático na pasta padrão 'site/'.
      - name: Construir Site
        run: mkdocs build

      # Passo 5: Configurar o GitHub Pages (usando a v5)
      # Este passo prepara o ambiente para o deploy no Pages.
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5 # Usando a versão v5.

      # Passo 6: Fazer Upload do Artefato do Site (APONTANDO PARA A PASTA CORRETA)
      # Usa a ação oficial para fazer upload da pasta 'site/' como um artefato nomeado 'github-pages'.
      # É CRUCIAL que 'path' aponte para a pasta onde o MkDocs construiu o site.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Define a pasta a ser carregada - DEVE ser a pasta de saída do MkDocs.
          path: './site' # Aponta para a pasta construída pelo MkDocs
          # Define o nome do artefato. 'github-pages' é o nome padrão esperado pelo Pages.
          name: github-pages
          # Define por quantos dias o artefato será retido (opcional).
          retention-days: 1

      # Passo 7: Fazer Deploy para GitHub Pages (Passo Final de Publicação)
      # Usa a ação oficial para acionar a publicação do artefato 'github-pages' no serviço de Pages.
      # Este passo é necessário quando a Source nas Pages Settings é 'GitHub Actions'.
      - name: Deploy to GitHub Pages
        id: deployment # Atribui um ID para referenciar outputs (como a URL do site)
        uses: actions/deploy-pages@v4 # Usa a ação de deploy final.
